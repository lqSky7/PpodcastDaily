name: Generate Research Paper Podcast

on:
  schedule:
    # Runs 4 times a day (every 6 hours: 8:07 AM IST, 2:07 PM IST, 8:07 PM IST, 2:07 AM IST)
    # Frequent triggers continuously refresh & auto-save Google session cookies to GitHub Secrets.
    - cron: '37 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Podcast Generator Pipeline
        env:
          NOTEBOOKLM_STORAGE_STATE: ${{ secrets.NOTEBOOKLM_STORAGE_STATE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python podcast_generator.py
